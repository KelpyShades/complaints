name: complaints
description: "A complaints management system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0

  # Navigation
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.12.2

  # UI Framework
  shadcn_ui: ^0.53.3

  # Notifications
  another_flushbar: ^1.12.32
  toastification: ^3.0.3

  # Utilities
  flutter_dotenv: ^5.2.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  intl: ^0.20.0
  timeago: ^3.7.0

  # Role caching
  shared_preferences: ^2.3.4

  # Report generation
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - .env
